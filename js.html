  let currentLang = localStorage.getItem('mms_lang') || 'th';
  let currentTicketDetailData = null;

  function changeLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[lang] && i18n[lang][key]) {
        if (el.id && el.id.endsWith('_label')) {
          const inputId = el.id.replace('_label', '');
          const input = document.getElementById(inputId);
          if (input && input.files && input.files[0]) {
            return; // keep existing selected filename
          }
        }
        el.innerText = i18n[lang][key];
      }
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (i18n[lang] && i18n[lang][key]) {
        el.setAttribute('placeholder', i18n[lang][key]);
      }
    });

    // Update select placeholder options
    const selMachOpt = document.querySelector('#selMachine option[value=""]');
    if (selMachOpt && i18n[lang] && i18n[lang].selectPlaceholder) {
      selMachOpt.innerText = i18n[lang].selectPlaceholder;
    }
    const urgOpt = document.querySelector('#urgency option[value=""]');
    if (urgOpt && i18n[lang] && i18n[lang].urgencyPlaceholder) {
      urgOpt.innerText = i18n[lang].urgencyPlaceholder;
    }

    // Re-render timeline if on ticket detail page
    const detailPage = document.getElementById('page-ticketDetail');
    if (detailPage && !detailPage.classList.contains('d-none') && currentTicketDetailData) {
      renderTimeline(currentTicketDetailData);
    }
  }

  function isEnglishOnly(str) {
    // Allows English letters, numbers, and basic punctuation
    return /^[\x20-\x7E\r\n]*$/.test(str);
  }

  let currentUser = null;
  let allMachines = [];
  let allTickets = [];

  // --- Client Info (Device & Public IP) ---
  async function getClientInfo() {
    let device = navigator.userAgent || "";
    let ip = "Unknown";
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2500);
      const resp = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
      clearTimeout(timeoutId);
      if (resp.ok) {
        const data = await resp.json();
        if (data && data.ip) ip = data.ip;
      }
    } catch (e) {
      // Ignore network failure / adblock
    }
    return { device: device, ip: ip };
  }

  // --- Utility: Show/Hide Loading ---
  function showLoading() {
    document.getElementById('loadingOverlay').classList.remove('d-none');
  }
  function hideLoading() {
    document.getElementById('loadingOverlay').classList.add('d-none');
  }

  // --- Initialize App ---
  document.addEventListener('DOMContentLoaded', () => {
    // Check saved language on load
    const savedLang = localStorage.getItem('mms_lang') || 'th';
    document.querySelectorAll('.langSelect').forEach(s => s.value = savedLang);
    changeLanguage(savedLang);

    // Handle select change
    document.querySelectorAll('.langSelect').forEach(select => {
      select.addEventListener('change', (e) => {
        const lang = e.target.value;
        document.querySelectorAll('.langSelect').forEach(s => s.value = lang);
        changeLanguage(lang);
        localStorage.setItem('mms_lang', lang);
      });
    });

    // Custom file input change listeners
    ['ticketImage1', 'ticketImage2', 'updBeforeImage', 'updAfterImage'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', () => handleCustomFileInput(id));
      }
    });

    // Session check
    let savedUser = sessionStorage.getItem('mms_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showMainApp();
    }
  });

  // --- Login Form Submit ---
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let u = document.getElementById('username').value;
    let p = document.getElementById('password').value;
    
    showLoading();
    const clientInfo = await getClientInfo();
    
    google.script.run
      .withSuccessHandler((res) => {
        hideLoading();
        if (res.success) {
          currentUser = res;
          sessionStorage.setItem('mms_user', JSON.stringify(res));
          showMainApp();
        } else {
          const lang = localStorage.getItem('mms_lang') || 'th';
          const dict = i18n[lang] || i18n.th;
          Swal.fire({ icon: 'error', title: dict.swalError || 'Error', text: res.message });
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
      })
      .loginUser(u, p, clientInfo);
  });

  // --- Toggle Login/Register Forms ---
  document.getElementById('toggleLoginBtn').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('toggleLoginBtn').classList.add('active-toggle-login');
    document.getElementById('toggleLoginBtn').classList.remove('text-muted');
    document.getElementById('toggleRegisterBtn').classList.remove('active-toggle-register');
    document.getElementById('toggleRegisterBtn').classList.add('text-muted');
    
    document.getElementById('loginForm').classList.remove('d-none');
    document.getElementById('registerForm').classList.add('d-none');
  });

  document.getElementById('toggleRegisterBtn').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('toggleRegisterBtn').classList.add('active-toggle-register');
    document.getElementById('toggleRegisterBtn').classList.remove('text-muted');
    document.getElementById('toggleLoginBtn').classList.remove('active-toggle-login');
    document.getElementById('toggleLoginBtn').classList.add('text-muted');
    
    document.getElementById('registerForm').classList.remove('d-none');
    document.getElementById('loginForm').classList.add('d-none');
  });

  // --- Register Form Submit ---
  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    let u = document.getElementById('regUsername').value;
    let p = document.getElementById('regPassword').value;
    
    // Validation: English only for username
    if (!/^[A-Za-z0-9_]+$/.test(u)) {
      document.getElementById('regUserError').classList.remove('d-none');
      return;
    } else {
      document.getElementById('regUserError').classList.add('d-none');
    }
    
    showLoading();
    google.script.run
      .withSuccessHandler((res) => {
        hideLoading();
        const lang = localStorage.getItem('mms_lang') || 'th';
        const dict = i18n[lang] || i18n.th;
        if (res.success) {
          Swal.fire({ icon: 'success', title: dict.swalSuccess || 'สำเร็จ', text: res.message });
          document.getElementById('registerForm').reset();
          document.getElementById('toggleLoginBtn').click();
        } else {
          Swal.fire({ icon: 'error', title: dict.swalError || 'ผิดพลาด', text: res.message });
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
      })
      .registerUser(u, p);
  });

  function showMainApp() {
    document.getElementById('loginPage').classList.add('d-none');
    document.getElementById('mainApp').classList.remove('d-none');
    document.getElementById('displayUserName').innerText = currentUser.name || currentUser.username;
    
    // Admin Only: Show User Management Nav Item
    const role = (currentUser.role || '').toLowerCase();
    const navUserMgmt = document.getElementById('navItemUserManagement');
    if (navUserMgmt) {

  // --- Load Data: Tickets ---
  function loadTickets() {
    showLoading();
    google.script.run
      .withSuccessHandler((tickets) => {
        allTickets = tickets || [];
        hideLoading();
        
        const tList = document.getElementById('ticketList');
        if (!tList) return;
        tList.innerHTML = '';
        
        if (!tickets || tickets.length === 0) {
          tList.innerHTML = `<div class="col-12 text-center text-muted py-5">ไม่มีข้อมูลใบแจ้งซ่อม</div>`;
          return;
        }

        tickets.forEach(t => {
          let badgeClass = 'bg-secondary';
          if (t.Status && t.Status.includes('รอดำเนินการ')) badgeClass = 'bg-danger';
          else if (t.Status && t.Status.includes('กำลังซ่อม')) badgeClass = 'bg-primary';
          else if (t.Status && t.Status.includes('รออะไหล่')) badgeClass = 'bg-warning text-dark';
          else if (t.Status && t.Status.includes('เสร็จสิ้น')) badgeClass = 'bg-success';

          let dateStr = '-';
          if (t.Timestamp) {
            let parsedDate = new Date(t.Timestamp);
            dateStr = isNaN(parsedDate.getTime()) ? t.Timestamp : parsedDate.toLocaleString('th-TH');
          }

          // Find machine details
          let machineDetailText = '';
          if (t.Machine_ID && typeof allMachines !== 'undefined') {
            let m = allMachines.find(x => x.name === t.Machine_ID || x.id === t.Machine_ID);
            if (m && m.details) {
              let parts = [];
              if (m.details.vendor) parts.push(m.details.vendor);
              if (m.details.mcModel) parts.push(m.details.mcModel);
              if (m.details.serNo) parts.push(m.details.serNo);
              if (m.details.mfgDate) parts.push('Mfg: ' + m.details.mfgDate);
              if (m.details.option) parts.push(m.details.option);
              if (parts.length > 0) {
                machineDetailText = `<div class="text-muted fw-normal text-truncate" style="font-size: 0.75rem; margin-top: 2px;">${parts.join(' | ')}</div>`;
              }
            }
          }

          tList.innerHTML += `
            <div class="col-md-6 col-lg-4 mb-4">
              <div class="card shadow-sm border-0 rounded-4 h-100 cursor-pointer" onclick="viewTicketDetail('${t.Ticket_ID}')" style="cursor: pointer;">
                <div class="card-body d-flex flex-column">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold text-primary">${t.Ticket_ID}</span>
                    <span class="badge ${badgeClass} status-badge">${t.Status || ''}</span>
                  </div>
                  <h6 class="fw-bold text-truncate mb-0">${t.Machine_ID || '-'}</h6>
                  ${machineDetailText}
                  <p class="small mb-3 text-truncate mt-2" style="color: #8B0000; font-weight: 500;">${t.Issue || '-'}</p>
                  <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                    <small class="text-muted"><i class="fas fa-clock me-1"></i> ${dateStr}</small>
                    <small class="fw-bold"><i class="fas fa-user me-1"></i> ${t.Reporter || '-'}</small>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
      })
      .withFailureHandler((err) => {
        hideLoading();
        console.error("loadTickets error:", err);
        const tList = document.getElementById('ticketList');
        if (tList) {
          tList.innerHTML = `<div class="col-12 text-center text-danger py-5">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.toString()}</div>`;
        }
      })
      .getTickets();
  }

  // --- Create Ticket ---
  document.getElementById('createTicketForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    let originalText = document.getElementById('transInput').value.trim();
    let engText = document.getElementById('issueDesc').value.trim();
    let selMachine = document.getElementById('selMachine').value;
    let urgency = document.getElementById('urgency').value;
    
    // Explicit Validation for required fields
    if (!selMachine || !engText || !urgency) {
      Swal.fire({
        icon: 'warning',
        title: 'ข้อมูลไม่ครบถ้วน / Missing Data',
        text: 'กรุณาเลือกเครื่องจักร, ระบุอาการเสีย และความเร่งด่วน / Please select Machine, Issue, and Urgency.'
      });
      return;
    }
    
    // Validation: English only for issue description
    if (!isEnglishOnly(engText)) {
      document.getElementById('issueError').classList.remove('d-none');
      return;
    } else {
      document.getElementById('issueError').classList.add('d-none');
    }

    let combinedIssue = engText;
    if (originalText) {
      combinedIssue = originalText + "_" + engText;
    }
    
    let btnSubmit = document.querySelector('#createTicketForm button[type="submit"]');
    if (btnSubmit) {
       btnSubmit.disabled = true;
       btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> กำลังอัปโหลด...';
    }

    let img1File = document.getElementById('ticketImage1').files[0];
    let img2File = document.getElementById('ticketImage2').files[0];
    
    let b64Img1 = null;
    let b64Img2 = null;
    
    showLoading();
    try {
      if (img1File) b64Img1 = await getBase64(img1File);
      if (img2File) b64Img2 = await getBase64(img2File);
    } catch(err) {
      hideLoading();
      Swal.fire('Error', 'ไม่สามารถอ่านไฟล์รูปภาพได้', 'error');
      if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> <span data-i18n="submitTicket">ส่งใบแจ้งซ่อม</span>'; }
      return;
    }

    let data = {
      machineId: selMachine,
      issue: combinedIssue,
      urgency: urgency,
      reporter: currentUser.name,
      image1Base64: b64Img1,
      image2Base64: b64Img2
    };
    
    google.script.run.withSuccessHandler((res) => {
      hideLoading();
      if(btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> <span data-i18n="submitTicket">ส่งใบแจ้งซ่อม</span>'; }
      if(res.success) {
        Swal.fire({ icon: 'success', title: 'สำเร็จ', text: `บันทึกหมายเลข ${res.ticketId} เรียบร้อย` });
        document.getElementById('createTicketForm').reset();
        clearCustomFile('ticketImage1');
        clearCustomFile('ticketImage2');
        document.getElementById('machineDetailText').innerHTML = '-'; // Reset details text
        document.querySelector('#sidebar .nav-link[data-page="updateTicket"]').click();
      }
    }).withFailureHandler((err) => {
      hideLoading();
      if(btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> <span data-i18n="submitTicket">ส่งใบแจ้งซ่อม</span>'; }
      Swal.fire('Error', err.toString(), 'error');
    }).createTicket(data);
  });

  // --- Auto Image Compression & Base64 Converter ---
  function getBase64(file, maxWidth = 1600, maxHeight = 1600, quality = 0.75) {
    return new Promise((resolve, reject) => {
      if (!file) { resolve(null); return; }
      if (!file.type || !file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          try {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', quality);
            resolve(compressed);
          } catch (canvasErr) {
            console.warn('Canvas compression fallback to raw:', canvasErr);
            resolve(e.target.result);
          }
        };
        img.onerror = () => {
          resolve(e.target.result);
        };
        img.src = e.target.result;
      };
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function startLiveScanner() {
    const video = document.getElementById('qrLiveVideo');
    const statusMsg = document.getElementById('qrScanStatusMsg');
    if (statusMsg) statusMsg.innerHTML = '<span class="text-info"><i class="fas fa-spinner fa-spin me-1"></i> กำลังเปิดกล้อง...</span>';

    stopLiveScanner();

    // Standard constraints - no restrictive exact ratios so all phone cameras accept it
    const constraintsList = [
      { audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } } },
      { audio: false, video: { facingMode: "environment" } },
      { audio: false, video: true }
    ];

    let stream = null;
    let lastErr = null;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (statusMsg) {
        statusMsg.innerHTML = '<span class="text-danger small">เบราว์เซอร์ไม่รองรับกล้องสด กรุณากดปุ่ม <b>"เลือกรูปแทน"</b></span>';
      }
      return;
    }

    for (let c of constraintsList) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        if (stream) break;
      } catch (err) {
        lastErr = err;
      }
    }

    if (!stream) {
      console.warn("Camera access failed:", lastErr);
      if (statusMsg) {
        const isLine = /Line\//i.test(navigator.userAgent);
        const errName = lastErr ? lastErr.name : '';
        if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
          statusMsg.innerHTML = '<span class="text-danger small"><i class="fas fa-lock me-1"></i> <b>สิทธิ์กล้องถูกปิดอยู่ (NotAllowedError)</b><br>แตะไอคอนตั้งค่าข้าง URL ด้านบน เพื่อ "อนุญาตสิทธิ์กล้อง"<br>หรือกดปุ่ม <b>"ถ่ายรูป QR"</b> ด้านล่าง</span>';
        } else if (isLine) {
          statusMsg.innerHTML = '<span class="text-warning small"><i class="fas fa-info-circle me-1"></i> แอป LINE ไม่รองรับการเปิดกล้องสด<br>กรุณากดปุ่ม <b>"ถ่ายรูป QR"</b> ด้านล่าง</span>';
        } else {
          statusMsg.innerHTML = `<span class="text-danger small">ไม่สามารถเปิดกล้องสดได้ (${errName || 'Denied'})<br>กรุณากดปุ่ม <b>"ถ่ายรูป QR"</b> ด้านล่าง</span>`;
        }
      }
      return;
    }

    mediaStream = stream;
    if (video) {
      video.srcObject = stream;
      video.setAttribute('playsinline', 'true');
      video.setAttribute('autoplay', 'true');
      video.setAttribute('muted', 'true');
      try {
        await video.play();
      } catch (e) {
        console.warn("Video play error:", e);
      }
    }

    if (statusMsg) statusMsg.innerHTML = '';
    
    // Start scanning frames continuously
    scanVideoLoop();
  }

  function stopLiveScanner() {
    if (scanAnimFrame) {
      cancelAnimationFrame(scanAnimFrame);
      scanAnimFrame = null;
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
    const video = document.getElementById('qrLiveVideo');
    if (video) {
      video.pause();
      video.srcObject = null;
    }
  }

  async function scanVideoLoop() {
    const video = document.getElementById('qrLiveVideo');
    if (!video || !mediaStream || video.paused || video.ended) return;

    if (!isDecodingFrame && video.readyState >= 2 && video.videoWidth > 0) {
      isDecodingFrame = true;
      try {
        let code = await decodeFrame(video);
        if (code) {
          handleLiveScanSuccess(code);
          return;
        }
      } catch (e) {
      } finally {
        isDecodingFrame = false;
      }
    }

    scanAnimFrame = requestAnimationFrame(scanVideoLoop);
  }

  async function decodeFrame(video) {
    // 1. Native BarcodeDetector (Fastest & natively built into Android Chrome)
    if ('BarcodeDetector' in window) {
      try {
        if (!window._bdDetector) {
          window._bdDetector = new BarcodeDetector({ formats: ['qr_code'] });
        }
        const barcodes = await window._bdDetector.detect(video);
        if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
          return barcodes[0].rawValue;
        }
      } catch (e) {}
    }

    // 2. jsQR on cropped center square of video
    if (typeof jsQR !== 'undefined') {
      try {
        if (!window._scanCanvas) {
          window._scanCanvas = document.createElement('canvas');
          window._scanCtx = window._scanCanvas.getContext('2d', { willReadFrequently: true });
        }
        const canvas = window._scanCanvas;
        const ctx = window._scanCtx;

        const vW = video.videoWidth;
        const vH = video.videoHeight;
        const cropSize = Math.floor(Math.min(vW, vH) * 0.75);
        const startX = Math.floor((vW - cropSize) / 2);
        const startY = Math.floor((vH - cropSize) / 2);

        canvas.width = 300;
        canvas.height = 300;
        ctx.drawImage(video, startX, startY, cropSize, cropSize, 0, 0, 300, 300);

        const imgData = ctx.getImageData(0, 0, 300, 300);
        const qr = jsQR(imgData.data, 300, 300, { inversionAttempts: "attemptBoth" });
        if (qr && qr.data) {
          return qr.data;
        }
      } catch (e) {}
    }

    return null;
  }

  }

  function decodeQRFromImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = async () => {
          // --- Method 1: Native BarcodeDetector (Fastest & most accurate on Android) ---
          if ('BarcodeDetector' in window) {
            try {
              const detector = new BarcodeDetector({ formats: ['qr_code'] });
              const barcodes = await detector.detect(img);
              if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
                return resolve(barcodes[0].rawValue);
              }
            } catch (errBD) {
              console.warn("BarcodeDetector error:", errBD);
            }
          }

          // --- Method 2: ZXing BrowserQRCodeReader & MultiFormatReader ---
          if (typeof ZXing !== 'undefined') {
            try {
              const zxingQR = new ZXing.BrowserQRCodeReader();
              const resQR = await zxingQR.decodeFromImageElement(img);
              if (resQR && resQR.getText()) {
                return resolve(resQR.getText());
              }
            } catch (errZX1) {}

            try {
              const zxingMulti = new ZXing.BrowserMultiFormatReader();
              const resMulti = await zxingMulti.decodeFromImageElement(img);
              if (resMulti && resMulti.getText()) {
                return resolve(resMulti.getText());
              }
            } catch (errZX2) {}
          }

          // --- Method 3: jsQR Multi-pass (Center Crop, Scaled, Contrast Enhanced) ---
          if (typeof jsQR !== 'undefined') {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            // Pass 3.1: Center 70% crop (targets QR code framed in center)
            try {
              const cropW = Math.round(img.width * 0.7);
              const cropH = Math.round(img.height * 0.7);
              const cropX = Math.round((img.width - cropW) / 2);
              const cropY = Math.round((img.height - cropH) / 2);

              canvas.width = cropW;
              canvas.height = cropH;
              ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

              let imgData = ctx.getImageData(0, 0, cropW, cropH);
              let code = jsQR(imgData.data, cropW, cropH, { inversionAttempts: "attemptBoth" });
              if (code && code.data) return resolve(code.data);
            } catch (errCrop) {
              console.warn("jsQR crop error:", errCrop);
            }

            // Pass 3.2: Scaled to 1800px max
            try {
              let w = img.width;
              let h = img.height;
              const maxDim = 1800;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              canvas.width = w;
              canvas.height = h;
              ctx.drawImage(img, 0, 0, w, h);

              let imgData = ctx.getImageData(0, 0, w, h);
              let code = jsQR(imgData.data, w, h, { inversionAttempts: "attemptBoth" });
              if (code && code.data) return resolve(code.data);

              // Pass 3.3: High contrast binarization
              for (let i = 0; i < imgData.data.length; i += 4) {
                let gray = 0.299 * imgData.data[i] + 0.587 * imgData.data[i + 1] + 0.114 * imgData.data[i + 2];
                let val = gray > 128 ? 255 : 0;
                imgData.data[i] = val;
                imgData.data[i + 1] = val;
                imgData.data[i + 2] = val;
              }
              let codeBinarized = jsQR(imgData.data, w, h, { inversionAttempts: "attemptBoth" });
              if (codeBinarized && codeBinarized.data) return resolve(codeBinarized.data);
            } catch (errFull) {
              console.warn("jsQR full image error:", errFull);
            }
          }

          // --- Method 4: Html5Qrcode fallback ---
          if (typeof Html5Qrcode !== 'undefined') {
            try {
              const html5QrCode = new Html5Qrcode("qrReaderHidden");
              const text = await html5QrCode.scanFile(file, false);
              if (text) return resolve(text);
            } catch (errHtml5) {}
          }

          reject(new Error("QR Code not found in image"));
        };
        img.onerror = () => reject(new Error("Failed to load image"));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("Failed to read file"));
      reader.readAsDataURL(file);
    });
  }

  async function onQRCodeScanned(rawCode) {
    if (!rawCode) return;
    const cleanCode = String(rawCode).trim();
    if (!cleanCode) return;

    // Safety: Ensure allMachines is loaded
    if (!allMachines || allMachines.length === 0) {
      showLoading();
      try {
        allMachines = await new Promise((resolve) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(() => resolve([]))
            .getMachines();
        }) || [];
      } catch (e) {
      } finally {
        hideLoading();
      }
    }

    const target = cleanCode.toLowerCase();
    const targetAlnum = target.replace(/[^a-z0-9]/g, '');

    // 1. Prioritize Ser.No. (Column G) as requested by user
    // 2. Secondary check QR column (Column A)
    // 3. Fallback check Line ID / Machine Name (Column C)
    const matchedMachine = allMachines.find(m => {
      const mSerNo = String(m.serNo || (m.details && m.details.serNo) || '').trim().toLowerCase();
      const mSerNoAlnum = mSerNo.replace(/[^a-z0-9]/g, '');
      const mQr = String(m.qr || '').trim().toLowerCase();
      const mId = String(m.id || '').trim().toLowerCase();
      const mName = String(m.name || '').trim().toLowerCase();
      const mNameAlnum = mName.replace(/[^a-z0-9]/g, '');
      const mModel = String((m.details && m.details.mcModel) || '').trim().toLowerCase();

      // Match by Ser.No. (exact, contains, or alphanumeric match)
      if (mSerNo) {
        if (mSerNo === target) return true;
        if (target.includes(mSerNo) || mSerNo.includes(target)) return true;
        if (mSerNoAlnum && targetAlnum && (targetAlnum === mSerNoAlnum || targetAlnum.includes(mSerNoAlnum) || mSerNoAlnum.includes(targetAlnum))) return true;
      }
      // Match by QR column
      if (mQr && (mQr === target || target.includes(mQr) || mQr.includes(target))) {
        return true;
      }
      // Match by Line ID / Machine Name
      if ((mId && (mId === target || target.includes(mId))) || (mName && (mName === target || target.includes(mName)))) {
        return true;
      }
      if (mNameAlnum && targetAlnum && (mNameAlnum === targetAlnum || targetAlnum.includes(mNameAlnum) || mNameAlnum.includes(targetAlnum))) {
        return true;
      }
      // Match by M/C Model
      if (mModel && (mModel === target || target.includes(mModel))) {
        return true;
      }
      return false;
    });

    if (matchedMachine) {
      const selMachine = document.getElementById('selMachine');
      if (selMachine) {
        selMachine.value = matchedMachine.id;
        if (!selMachine.value) {
          for (let opt of selMachine.options) {
            if (opt.value.toLowerCase() === matchedMachine.id.toLowerCase() ||
                opt.text.toLowerCase().includes(matchedMachine.name.toLowerCase()) ||
                opt.text.toLowerCase().includes(matchedMachine.id.toLowerCase())) {
              selMachine.value = opt.value;
              break;
            }
          }
        }
        selMachine.dispatchEvent(new Event('change'));
      }
      const serNoVal = matchedMachine.serNo || (matchedMachine.details && matchedMachine.details.serNo) || '-';
      const statusBadge = matchedMachine.status ? `<span class="badge ${matchedMachine.status.toLowerCase() === 'active' ? 'bg-success' : 'bg-secondary'} ms-1">${matchedMachine.status}</span>` : '';
      
      Swal.fire({
        icon: 'success',
        title: (i18n[currentLang] && i18n[currentLang].qrFoundTitle) || 'เลือกเครื่องจักรสำเร็จ',
        html: `
          <div class="fw-bold fs-4 text-primary mb-1">${matchedMachine.name} ${statusBadge}</div>
          <div class="text-muted small mt-2">Ser.No: <span class="fw-bold text-dark">${serNoVal}</span></div>
        `,
        timer: 2200,
        showConfirmButton: false
      });
    } else {
      Swal.fire({
        icon: 'warning',
        title: (i18n[currentLang] && i18n[currentLang].qrNotFoundTitle) || 'ไม่พบข้อมูลเครื่องจักร',
        html: `
          <div class="text-muted mb-2">${(i18n[currentLang] && i18n[currentLang].qrNotFoundDesc) || 'ไม่พบเครื่องจักรที่ตรงกับ QR Code / Ser.No.'}</div>
          <div class="p-3 bg-light border rounded-3 text-start small font-monospace">
            <span class="text-muted">ค่าที่สแกนได้:</span><br>
            <b class="text-danger text-break fs-6">${escapeHtml(cleanCode)}</b>
          </div>
        `
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.openImageModal = openImageModal;
</script>
