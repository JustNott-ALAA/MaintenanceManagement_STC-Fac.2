  function changeLanguage(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[lang] && i18n[lang][key]) {
        el.innerText = i18n[lang][key];
      }
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (i18n[lang] && i18n[lang][key]) {
        el.setAttribute('placeholder', i18n[lang][key]);
      }
    });
  }

  function isEnglishOnly(str) {
    // Allows English letters, numbers, and basic punctuation
    return /^[\x20-\x7E\r\n]*$/.test(str);
  }

  let currentUser = null;
  let allMachines = [];
  let allTickets = [];

  // --- Client Info (Device & Public IP) ---
  async function getClientInfo() {
    let device = navigator.userAgent || "";
    let ip = "Unknown";
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2500);
      const resp = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
      clearTimeout(timeoutId);
      if (resp.ok) {
        const data = await resp.json();
        if (data && data.ip) ip = data.ip;
      }
    } catch (e) {
      // Ignore network failure / adblock
    }
    return { device: device, ip: ip };
  }

  // --- Utility: Show/Hide Loading ---
  function showLoading() {
    document.getElementById('loadingOverlay').classList.remove('d-none');
  }
  function hideLoading() {
    document.getElementById('loadingOverlay').classList.add('d-none');
  }

  // --- Initialize App ---
  document.addEventListener('DOMContentLoaded', () => {
    // Check saved language on load
    const savedLang = localStorage.getItem('mms_lang') || 'th';
    document.querySelectorAll('.langSelect').forEach(s => s.value = savedLang);
    changeLanguage(savedLang);

    // Handle select change
    document.querySelectorAll('.langSelect').forEach(select => {
      select.addEventListener('change', (e) => {
        const lang = e.target.value;
        document.querySelectorAll('.langSelect').forEach(s => s.value = lang);
        changeLanguage(lang);
        localStorage.setItem('mms_lang', lang);
      });
    });

    // Session check
    let savedUser = sessionStorage.getItem('mms_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showMainApp();
    }
  });

  // --- Login Form Submit ---
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let u = document.getElementById('username').value;
    let p = document.getElementById('password').value;
    
    showLoading();
    const clientInfo = await getClientInfo();
    
    google.script.run
      .withSuccessHandler((res) => {
        hideLoading();
        if (res.success) {
          currentUser = res;
          sessionStorage.setItem('mms_user', JSON.stringify(res));
          showMainApp();
        } else {
          const lang = localStorage.getItem('mms_lang') || 'th';
          const dict = i18n[lang] || i18n.th;
          Swal.fire({ icon: 'error', title: dict.swalError || 'Error', text: res.message });
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
      })
      .loginUser(u, p, clientInfo);
  });

  // --- Toggle Login/Register Forms ---
  document.getElementById('toggleLoginBtn').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('toggleLoginBtn').classList.add('active-toggle-login');
    document.getElementById('toggleLoginBtn').classList.remove('text-muted');
    document.getElementById('toggleRegisterBtn').classList.remove('active-toggle-register');
    document.getElementById('toggleRegisterBtn').classList.add('text-muted');
    
    document.getElementById('loginForm').classList.remove('d-none');
    document.getElementById('registerForm').classList.add('d-none');
  });

  document.getElementById('toggleRegisterBtn').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('toggleRegisterBtn').classList.add('active-toggle-register');
    document.getElementById('toggleRegisterBtn').classList.remove('text-muted');
    document.getElementById('toggleLoginBtn').classList.remove('active-toggle-login');
    document.getElementById('toggleLoginBtn').classList.add('text-muted');
    
    document.getElementById('registerForm').classList.remove('d-none');
    document.getElementById('loginForm').classList.add('d-none');
  });

  // --- Register Form Submit ---
  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    let u = document.getElementById('regUsername').value;
    let p = document.getElementById('regPassword').value;
    
    // Validation: English only for username
    if (!/^[A-Za-z0-9_]+$/.test(u)) {
      document.getElementById('regUserError').classList.remove('d-none');
      return;
    } else {
      document.getElementById('regUserError').classList.add('d-none');
    }
    
    showLoading();
    google.script.run
      .withSuccessHandler((res) => {
        hideLoading();
        const lang = localStorage.getItem('mms_lang') || 'th';
        const dict = i18n[lang] || i18n.th;
        if (res.success) {
          Swal.fire({ icon: 'success', title: dict.swalSuccess || 'สำเร็จ', text: res.message });
          document.getElementById('registerForm').reset();
          document.getElementById('toggleLoginBtn').click();
        } else {
          Swal.fire({ icon: 'error', title: dict.swalError || 'ผิดพลาด', text: res.message });
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
      })
      .registerUser(u, p);
  });

  function showMainApp() {
    document.getElementById('loginPage').classList.add('d-none');
    document.getElementById('mainApp').classList.remove('d-none');
    document.getElementById('displayUserName').innerText = currentUser.name || currentUser.username;
    
    // Admin Only: Show User Management Nav Item
    const role = (currentUser.role || '').toLowerCase();
    const navUserMgmt = document.getElementById('navItemUserManagement');
    if (navUserMgmt) {
      if (role === 'admin') {
        navUserMgmt.classList.remove('d-none');
      } else {
        navUserMgmt.classList.add('d-none');
      }
    }
    
    // Language Sync from Login to Main App
    const currentLang = localStorage.getItem('mms_lang') || 'th';
    document.querySelectorAll('.langSelect').forEach(s => s.value = currentLang);
    changeLanguage(currentLang);
    
    // Load initial data
    loadMachines();
    switchPage('dashboard');
  }

  // --- Logout ---
  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.removeItem('mms_user');
    currentUser = null;
    document.getElementById('mainApp').classList.add('d-none');
    document.getElementById('loginPage').classList.remove('d-none');
    document.getElementById('loginForm').reset();
  });

  // --- SPA Navigation ---
  const navLinks = document.querySelectorAll('#sidebar .nav-link[data-page]');
  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      let target = e.currentTarget.getAttribute('data-page');
      
      navLinks.forEach(l => l.classList.remove('active'));
      e.currentTarget.classList.add('active');
      
      switchPage(target);
      
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('mobile-show');
      }
    });
  });

  function switchPage(pageId) {
    document.querySelectorAll('.page-section').forEach(p => p.classList.add('d-none'));
    const targetPage = document.getElementById('page-' + pageId);
    if (targetPage) targetPage.classList.remove('d-none');
    
    // Refresh data based on page
    if (pageId === 'dashboard' || pageId === 'createTicket') loadMachines();
    if (pageId === 'updateTicket') loadTickets();
    if (pageId === 'userManagement') loadUsersList();
  }

  // --- Admin User Management ---
  function loadUsersList() {
    if (!currentUser || (currentUser.role || '').toLowerCase() !== 'admin') return;
    showLoading();
    google.script.run
      .withSuccessHandler((res) => {
        hideLoading();
        if (res.success) {
          renderUserTable(res.users);
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        }
      })
      .withFailureHandler((err) => {
        hideLoading();
        Swal.fire({ icon: 'error', title: 'Error', text: err.toString() });
      })
      .getUsersList(currentUser.username);
  }

  function renderUserTable(users) {
    const tbody = document.getElementById('userTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    
    const lang = localStorage.getItem('mms_lang') || 'th';
    const dict = i18n[lang] || i18n.th;
    
    if (!users || users.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">ไม่พบข้อมูลผู้ใช้งาน</td></tr>`;
      return;
    }
    
    users.forEach(u => {
      const isSelf = (currentUser && currentUser.username.toLowerCase() === u.username.toLowerCase());
      const statusBadge = (u.status === 'Active') 
        ? `<span class="badge bg-success">${dict.statusActive || 'Active'}</span>` 
        : `<span class="badge bg-secondary">${dict.statusInactive || 'Inactive'}</span>`;
      const roleBadge = (u.role === 'Admin') 
        ? `<span class="badge bg-primary">${dict.roleAdmin || 'Admin'}</span>` 
        : `<span class="badge bg-info text-dark">${dict.roleUser || 'User'}</span>`;
      
      const toggleStatusBtnText = (u.status === 'Active') ? (dict.btnSuspend || 'ระงับ') : (dict.btnActivate || 'เปิดใช้งาน');
      const toggleStatusBtnClass = (u.status === 'Active') ? 'btn-outline-warning' : 'btn-outline-success';
      
      tbody.innerHTML += `
        <tr>
          <td class="ps-4 fw-bold">
            <i class="fas fa-user-circle text-secondary me-2"></i>${u.username}
            ${isSelf ? '<small class="text-primary ms-1">(คุณ)</small>' : ''}
          </td>
          <td>${roleBadge}</td>
          <td>${statusBadge}</td>
          <td class="small text-muted">${u.createdAt}</td>
          <td class="text-end pe-4">
            <button class="btn btn-sm btn-outline-secondary rounded-pill me-1" onclick="handleResetPassword('${u.username}')" title="${dict.btnResetPwd || 'รีเซ็ตรหัสผ่าน'}">
              <i class="fas fa-key"></i> <span class="d-none d-lg-inline">${dict.btnResetPwd || 'รีเซ็ต'}</span>
            </button>
            <button class="btn btn-sm ${toggleStatusBtnClass} rounded-pill me-1" onclick="handleToggleStatus('${u.username}', '${u.status}')" ${isSelf ? 'disabled' : ''} title="${toggleStatusBtnText}">
              <i class="fas ${u.status === 'Active' ? 'fa-ban' : 'fa-check'}"></i> <span class="d-none d-lg-inline">${toggleStatusBtnText}</span>
            </button>
            <button class="btn btn-sm btn-outline-info rounded-pill" onclick="handleUpdateRole('${u.username}', '${u.role}')" ${isSelf ? 'disabled' : ''} title="${dict.btnChangeRole || 'เปลี่ยนสิทธิ์'}">
              <i class="fas fa-user-shield"></i> <span class="d-none d-lg-inline">${dict.btnChangeRole || 'เปลี่ยนสิทธิ์'}</span>
            </button>
          </td>
        </tr>
      `;
    });
  }

  document.getElementById('btnRefreshUsers')?.addEventListener('click', () => {
    loadUsersList();
  });

  window.handleResetPassword = function(targetUser) {
    const lang = localStorage.getItem('mms_lang') || 'th';
    const dict = i18n[lang] || i18n.th;
    
    Swal.fire({
      title: dict.swalResetPwdTitle || 'รีเซ็ตรหัสผ่านใหม่',
      text: (dict.swalResetPwdText || 'กรุณาระบุรหัสผ่านใหม่สำหรับ: ') + targetUser,
      input: 'password',
      inputPlaceholder: 'New Password...',
      showCancelButton: true,
      confirmButtonText: dict.swalConfirm || 'ยืนยัน',
      cancelButtonText: dict.swalCancel || 'ยกเลิก',
      inputValidator: (value) => {
        if (!value || value.trim().length < 4) {
          return 'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร';
        }
      }
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading();
        google.script.run
          .withSuccessHandler((res) => {
            hideLoading();
            if (res.success) {
              Swal.fire({ icon: 'success', title: dict.swalSuccess || 'สำเร็จ', text: res.message });
            } else {
              Swal.fire({ icon: 'error', title: dict.swalError || 'ผิดพลาด', text: res.message });
            }
          })
          .withFailureHandler((err) => {
            hideLoading();
            Swal.fire({ icon: 'error', title: dict.swalError || 'ผิดพลาด', text: err.toString() });
          })
          .adminResetPassword(currentUser.username, targetUser, result.value);
      }
    });
  };

  window.handleToggleStatus = function(targetUser, currentStatus) {
    const newStatus = (currentStatus === 'Active') ? 'Inactive' : 'Active';
    const lang = localStorage.getItem('mms_lang') || 'th';
    const dict = i18n[lang] || i18n.th;
    
    Swal.fire({
      title: dict.swalConfirm || 'ยืนยันการทำรายการ',
      text: `ต้องการเปลี่ยนสถานะของ ${targetUser} เป็น "${newStatus}" หรือไม่?`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: dict.swalConfirm || 'ยืนยัน',
      cancelButtonText: dict.swalCancel || 'ยกเลิก'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading();
        google.script.run
          .withSuccessHandler((res) => {
            hideLoading();
            if (res.success) {
              Swal.fire({ icon: 'success', title: dict.swalSuccess || 'สำเร็จ', text: res.message });
              loadUsersList();
            } else {
              Swal.fire({ icon: 'error', title: dict.swalError || 'ผิดพลาด', text: res.message });
            }
          })
          .withFailureHandler((err) => {
            hideLoading();
            Swal.fire({ icon: 'error', title: dict.swalError || 'ผิดพลาด', text: err.toString() });
          })
          .adminToggleStatus(currentUser.username, targetUser, newStatus);
      }
    });
  };

  window.handleUpdateRole = function(targetUser, currentRole) {
    const newRole = (currentRole === 'Admin') ? 'User' : 'Admin';
    const lang = localStorage.getItem('mms_lang') || 'th';
    const dict = i18n[lang] || i18n.th;
    
    Swal.fire({
      title: dict.swalConfirm || 'ยืนยันการเปลี่ยนสิทธิ์',
      text: `ต้องการเปลี่ยนสิทธิ์ของ ${targetUser} จาก "${currentRole}" เป็น "${newRole}" หรือไม่?`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: dict.swalConfirm || 'ยืนยัน',
      cancelButtonText: dict.swalCancel || 'ยกเลิก'
    }).then((result) => {

  // --- Load Data: Tickets ---
  function loadTickets() {
    showLoading();
    google.script.run
      .withSuccessHandler((tickets) => {
        allTickets = tickets || [];
        hideLoading();
        
        const tList = document.getElementById('ticketList');
        if (!tList) return;
        tList.innerHTML = '';
        
        if (!tickets || tickets.length === 0) {
          tList.innerHTML = `<div class="col-12 text-center text-muted py-5">ไม่มีข้อมูลใบแจ้งซ่อม</div>`;
          return;
        }

        tickets.forEach(t => {
          let badgeClass = 'bg-secondary';
          if (t.Status && t.Status.includes('รอดำเนินการ')) badgeClass = 'bg-danger';
          else if (t.Status && t.Status.includes('กำลังซ่อม')) badgeClass = 'bg-primary';
          else if (t.Status && t.Status.includes('รออะไหล่')) badgeClass = 'bg-warning text-dark';
          else if (t.Status && t.Status.includes('เสร็จสิ้น')) badgeClass = 'bg-success';

          let dateStr = '-';
          if (t.Timestamp) {
            let parsedDate = new Date(t.Timestamp);
            dateStr = isNaN(parsedDate.getTime()) ? t.Timestamp : parsedDate.toLocaleString('th-TH');
          }

          // Find machine details
          let machineDetailText = '';
          if (t.Machine_ID && typeof allMachines !== 'undefined') {
            let m = allMachines.find(x => x.name === t.Machine_ID || x.id === t.Machine_ID);
            if (m && m.details) {
              let parts = [];
              if (m.details.vendor) parts.push(m.details.vendor);
              if (m.details.mcModel) parts.push(m.details.mcModel);
              if (m.details.serNo) parts.push(m.details.serNo);
              if (m.details.mfgDate) parts.push('Mfg: ' + m.details.mfgDate);
              if (m.details.option) parts.push(m.details.option);
              if (parts.length > 0) {
                machineDetailText = `<div class="text-muted fw-normal text-truncate" style="font-size: 0.75rem; margin-top: 2px;">${parts.join(' | ')}</div>`;
              }
            }
          }

          tList.innerHTML += `
            <div class="col-md-6 col-lg-4 mb-4">
              <div class="card shadow-sm border-0 rounded-4 h-100 cursor-pointer" onclick="viewTicketDetail('${t.Ticket_ID}')" style="cursor: pointer;">
                <div class="card-body d-flex flex-column">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold text-primary">${t.Ticket_ID}</span>
                    <span class="badge ${badgeClass} status-badge">${t.Status || ''}</span>
                  </div>
                  <h6 class="fw-bold text-truncate mb-0">${t.Machine_ID || '-'}</h6>
                  ${machineDetailText}
                  <p class="small mb-3 text-truncate mt-2" style="color: #8B0000; font-weight: 500;">${t.Issue || '-'}</p>
                  <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                    <small class="text-muted"><i class="fas fa-clock me-1"></i> ${dateStr}</small>
                    <small class="fw-bold"><i class="fas fa-user me-1"></i> ${t.Reporter || '-'}</small>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
      })
      .withFailureHandler((err) => {
        hideLoading();
        console.error("loadTickets error:", err);
        const tList = document.getElementById('ticketList');
        if (tList) {
          tList.innerHTML = `<div class="col-12 text-center text-danger py-5">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.toString()}</div>`;
        }
      })
      .getTickets();
  }

  // --- Create Ticket ---
  document.getElementById('createTicketForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    let originalText = document.getElementById('transInput').value.trim();
    let engText = document.getElementById('issueDesc').value.trim();
    let selMachine = document.getElementById('selMachine').value;
    let urgency = document.getElementById('urgency').value;
    
    // Explicit Validation for required fields
    if (!selMachine || !engText || !urgency) {
      Swal.fire({
        icon: 'warning',
        title: 'ข้อมูลไม่ครบถ้วน / Missing Data',
        text: 'กรุณาเลือกเครื่องจักร, ระบุอาการเสีย และความเร่งด่วน / Please select Machine, Issue, and Urgency.'
      });
      return;
    }
    
    // Validation: English only for issue description
    if (!isEnglishOnly(engText)) {
      document.getElementById('issueError').classList.remove('d-none');
      return;
    } else {
      document.getElementById('issueError').classList.add('d-none');
    }

    let combinedIssue = engText;
    if (originalText) {
      combinedIssue = originalText + "_" + engText;
    }
    
    let btnSubmit = document.querySelector('#createTicketForm button[type="submit"]');
    if (btnSubmit) {
       btnSubmit.disabled = true;
       btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> กำลังอัปโหลด...';
    }

    let img1File = document.getElementById('ticketImage1').files[0];
    let img2File = document.getElementById('ticketImage2').files[0];
    
    // Simple 2MB size check
    if (img1File && img1File.size > 2 * 1024 * 1024) {
      Swal.fire('Warning', 'รูปภาพประกอบ 1 มีขนาดเกิน 2MB', 'warning');
      if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> ส่งใบแจ้งซ่อม'; }
      return;
    }
    if (img2File && img2File.size > 2 * 1024 * 1024) {
      Swal.fire('Warning', 'รูปภาพประกอบ 2 มีขนาดเกิน 2MB', 'warning');
      if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> ส่งใบแจ้งซ่อม'; }
      return;
    }

    let b64Img1 = null;
    let b64Img2 = null;
    
    showLoading();
    try {
      if (img1File) b64Img1 = await getBase64(img1File);
      if (img2File) b64Img2 = await getBase64(img2File);
    } catch(err) {
      hideLoading();
      Swal.fire('Error', 'ไม่สามารถอ่านไฟล์รูปภาพได้', 'error');
      if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> ส่งใบแจ้งซ่อม'; }
      return;
    }

    let data = {
      machineId: selMachine,
      issue: combinedIssue,
      urgency: urgency,
      reporter: currentUser.name,
      image1Base64: b64Img1,
      image2Base64: b64Img2
    };
    
    google.script.run.withSuccessHandler((res) => {
      hideLoading();
      if(btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> <span data-i18n="submitTicket">ส่งใบแจ้งซ่อม</span>'; }
      if(res.success) {
        Swal.fire({ icon: 'success', title: 'สำเร็จ', text: `บันทึกหมายเลข ${res.ticketId} เรียบร้อย` });
        document.getElementById('createTicketForm').reset();
        document.getElementById('machineDetailText').innerHTML = '-'; // Reset details text
        document.querySelector('#sidebar .nav-link[data-page="updateTicket"]').click();
      }
    }).withFailureHandler((err) => {
      hideLoading();
      if(btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="fas fa-paper-plane me-2"></i> <span data-i18n="submitTicket">ส่งใบแจ้งซ่อม</span>'; }
      Swal.fire('Error', err.toString(), 'error');
    }).createTicket(data);
  });

  // --- View Ticket Detail ---
  function viewTicketDetail(ticketId) {
    showLoading();
    google.script.run
      .withSuccessHandler((data) => {
        hideLoading();
        
        if (!data || !data.ticket) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'ไม่พบข้อมูลใบงาน' });
          return;
        }

        // Switch Page manually
        document.querySelectorAll('.page-section').forEach(p => p.classList.add('d-none'));
        document.getElementById('page-ticketDetail').classList.remove('d-none');
        
        // Fill Info
        const t = data.ticket;
        document.getElementById('detailTicketId').innerText = t.Ticket_ID || '';
        document.getElementById('detailMachine').innerText = t.Machine_ID || '-';
        
        let mDetailEl = document.getElementById('detailMachineDesc');
        if (mDetailEl) {
          mDetailEl.innerHTML = '';
          if (t.Machine_ID && typeof allMachines !== 'undefined') {
            let m = allMachines.find(x => x.name === t.Machine_ID || x.id === t.Machine_ID);
            if (m && m.details) {
              let parts = [];
              if (m.details.vendor) parts.push(m.details.vendor);
              if (m.details.mcModel) parts.push(m.details.mcModel);
              if (m.details.serNo) parts.push(m.details.serNo);
              if (m.details.mfgDate) parts.push('Mfg: ' + m.details.mfgDate);
              if (m.details.option) parts.push(m.details.option);
              
              if (parts.length > 0) {
                mDetailEl.innerHTML = parts.join(' | ');
              }
            }
          }
        }
        
        document.getElementById('detailIssue').innerText = t.Issue || '-';
        
        let dImgHtml = '';
        if (t.Image_1) {
          dImgHtml += `<div class="d-inline-block position-relative me-2 mt-2" onclick="openImageModal('${t.Image_1}', 'รูปภาพประกอบ 1')" style="cursor: pointer;"><img src="${t.Image_1}" class="img-thumbnail shadow-sm" style="height:80px; width:80px; object-fit:cover; border-radius:10px;" alt="Image 1"></div>`;
        }
        if (t.Image_2) {
          dImgHtml += `<div class="d-inline-block position-relative me-2 mt-2" onclick="openImageModal('${t.Image_2}', 'รูปภาพประกอบ 2')" style="cursor: pointer;"><img src="${t.Image_2}" class="img-thumbnail shadow-sm" style="height:80px; width:80px; object-fit:cover; border-radius:10px;" alt="Image 2"></div>`;
        }
        document.getElementById('detailImages').innerHTML = dImgHtml;

        document.getElementById('detailReporter').innerText = t.Reporter || '-';
        
        let bClass = (t.Status && t.Status.includes('เสร็จสิ้น')) ? 'bg-success' : 'bg-warning';
        document.getElementById('detailStatus').innerText = t.Status || '-';
        document.getElementById('detailStatus').className = `badge ${bClass} text-dark`;
        
        // Update form init
        document.getElementById('updTicketId').value = t.Ticket_ID || '';
        document.getElementById('updStatus').value = t.Status || '';
        document.getElementById('updDetails').value = '';
        document.getElementById('updBeforeImage').value = '';
        document.getElementById('updAfterImage').value = '';

        // Build Timeline
        const tlContainer = document.getElementById('timelineContainer');
        tlContainer.innerHTML = '';
        
        let allEvents = [];
        if (data.history && Array.isArray(data.history)) {
          data.history.forEach(h => {
            let tDate = h.Timestamp ? new Date(h.Timestamp) : new Date(0);
            allEvents.push({ type: 'status', time: tDate, data: h });
          });
        }
        if (data.repairs && Array.isArray(data.repairs)) {
          data.repairs.forEach(r => {
            let tDate = r.Timestamp ? new Date(r.Timestamp) : new Date(0);
            allEvents.push({ type: 'repair', time: tDate, data: r });
          });
        }
        
        // Sort desc
        allEvents.sort((a,b) => b.time - a.time);

        if(allEvents.length === 0) tlContainer.innerHTML = '<p class="text-muted">ยังไม่มีประวัติการดำเนินการ</p>';

        allEvents.forEach(ev => {
          let dateStr = isNaN(ev.time.getTime()) ? '-' : ev.time.toLocaleString('th-TH');
          if(ev.type === 'status') {
            let h = ev.data;
            let statusColor = "color: #0d6efd;"; // default primary
            if (h.New_Status) {
              if (h.New_Status.includes('เสร็จสิ้น')) statusColor = "color: #198754;"; // Green
              else if (h.New_Status.includes('รอดำเนินการ')) statusColor = "color: #8B0000;"; // Dark Red
              else if (h.New_Status.includes('กำลังซ่อม')) statusColor = "color: #D97706;"; // Amber/Yellow
              else if (h.New_Status.includes('รออะไหล่')) statusColor = "color: #fd7e14;"; // Orange
            }
            
            tlContainer.innerHTML += `
              <div class="timeline-item">
                <div class="timeline-marker bg-secondary"></div>
                <div class="timeline-content">
                  <span class="timeline-date">${dateStr} - ${h.Update_By || '-'}</span>
                  <p class="mb-0 fw-bold">เปลี่ยนสถานะ: <span class="text-muted">${h.Old_Status || '-'}</span> <i class="fas fa-arrow-right mx-1"></i> <span style="${statusColor}">${h.New_Status || '-'}</span></p>
                </div>
              </div>
            `;
          } else {
            let r = ev.data;
            let imgHtml = '';
            if(r.Before_Image) imgHtml += `<div class="d-inline-block position-relative me-2 mt-2" onclick="openImageModal('${r.Before_Image}', 'ภาพก่อนซ่อม (Before)')" style="cursor: pointer;" title="คลิกเพื่อดูรูปภาพขนาดใหญ่"><img src="${r.Before_Image}" class="img-thumbnail shadow-sm" style="height:60px; width:60px; object-fit:cover; border-radius:10px;" alt="Before"><span class="badge bg-dark bg-opacity-75 position-absolute bottom-0 start-0 m-1" style="font-size:0.65rem;">Before</span></div>`;
            if(r.After_Image) imgHtml += `<div class="d-inline-block position-relative me-2 mt-2" onclick="openImageModal('${r.After_Image}', 'ภาพหลังซ่อม (After)')" style="cursor: pointer;" title="คลิกเพื่อดูรูปภาพขนาดใหญ่"><img src="${r.After_Image}" class="img-thumbnail shadow-sm" style="height:60px; width:60px; object-fit:cover; border-radius:10px;" alt="After"><span class="badge bg-success bg-opacity-75 position-absolute bottom-0 start-0 m-1" style="font-size:0.65rem;">After</span></div>`;

            
            tlContainer.innerHTML += `
              <div class="timeline-item">
                <div class="timeline-marker bg-primary"></div>
                <div class="timeline-content">
                  <span class="timeline-date">${dateStr} - ${r.Repairer || '-'}</span>
                  <p class="mb-1 text-primary fw-bold"><i class="fas fa-wrench me-1"></i> อัปเดตงานซ่อม</p>
                  ${r.Repair_Details ? `<p class="mb-0 small">${r.Repair_Details}</p>` : ''}
                  <div class="timeline-images">${imgHtml}</div>
                </div>
              </div>
            `;
          }
        });
        
      })
      .withFailureHandler((err) => {
        hideLoading();
        Swal.fire({ icon: 'error', title: 'Error', text: err.toString() });
      })
      .getTicketDetails(ticketId);
  }

  // --- File to Base64 ---
  function getBase64(file) {
    return new Promise((resolve, reject) => {
      if(!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  // --- Submit Update (Auto-Reload Timeline) ---
  document.getElementById('updateTicketForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังอัปโหลด...';

    let fileBefore = document.getElementById('updBeforeImage').files[0];
    let fileAfter = document.getElementById('updAfterImage').files[0];
    
    // Convert files to base64
    let base64Before = await getBase64(fileBefore);
    let base64After = await getBase64(fileAfter);

    let payload = {
      ticketId: document.getElementById('updTicketId').value,
      newStatus: document.getElementById('updStatus').value,
      repairDetails: document.getElementById('updDetails').value,
      updateBy: currentUser.name,
      beforeImageBase64: base64Before,
      afterImageBase64: base64After
    };

    google.script.run.withSuccessHandler((res) => {
      btn.disabled = false;
      btn.innerHTML = 'บันทึกการอัปเดต';
      if(res.success) {
        Swal.fire({ icon: 'success', title: 'อัปเดตสำเร็จ', timer: 1500, showConfirmButton: false });
        // Auto-Reload Timeline by calling viewTicketDetail again
        viewTicketDetail(payload.ticketId);
      }
    }).updateTicket(payload);
  });

  // --- Image Modal Helper Functions ---
  function openImageModal(imgUrl, title) {
    const modalImg = document.getElementById('previewModalImg');
    const modalTitle = document.getElementById('imageModalTitle');
    const modalRawLink = document.getElementById('modalRawLink');
    
    let displayUrl = imgUrl;
    if (imgUrl) {
      const match = imgUrl.match(/[-\w]{25,}/);
      if (match && !imgUrl.startsWith('data:image')) {
        displayUrl = 'https://drive.google.com/thumbnail?id=' + match[0] + '&sz=w1200';
      }
    }
    
    if (modalImg) {
      modalImg.src = displayUrl;
      modalImg.onerror = function() {
        const m = imgUrl.match(/[-\w]{25,}/);
        if(m && !this.src.includes('googleusercontent')) {
           this.src = 'https://lh3.googleusercontent.com/d/' + m[0];
        }
      };
    }
    if (modalTitle && title) {
      modalTitle.innerText = title;
    }
    if (modalRawLink) {
      modalRawLink.href = imgUrl;
    }
    
    const modalEl = document.getElementById('imagePreviewModal');
    if (modalEl) {
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }
  }

  document.getElementById('selMachine')?.addEventListener('change', function(e) {
    const detailEl = document.getElementById('machineDetailText');
    if (!detailEl) return;
    
    const selectedId = e.target.value;
    if (!selectedId) {
      detailEl.innerHTML = '-';
      return;
    }
    
    const machine = allMachines.find(m => m.id === selectedId);
    if (machine && machine.details) {
      const d = machine.details;
      let parts = [];
      if (d.vendor) parts.push(d.vendor);
      if (d.mcModel) parts.push(d.mcModel);
      if (d.serNo) parts.push(d.serNo);
      if (d.mfgDate) parts.push(`Mfg: ${d.mfgDate}`);
      if (d.option) parts.push(d.option);
      
      if (parts.length > 0) {
        detailEl.innerHTML = parts.join(' | ');
      } else {
        detailEl.innerHTML = '-';
      }
    } else {
      detailEl.innerHTML = '-';
    }
  });

  window.openImageModal = openImageModal;
</script>
